# Site de Looty (présentation, téléchargements, mises à jour, dépôt apt).
# Copier en docker-compose.yml, définir LOOTY_SITE_URL et LOOTY_SITE_UPLOAD_TOKEN dans .env,
# puis placer un proxy HTTPS (Caddy, nginx…) devant le port 8080.
services:
  site:
    image: ghcr.io/untypequicode/looty-site:latest
    restart: unless-stopped
    environment:
      SITE_URL: ${LOOTY_SITE_URL:?adresse publique du site, ex. https://looty.example.org}
      UPLOAD_TOKEN: ${LOOTY_SITE_UPLOAD_TOKEN:?jeton long et secret, le même que le secret SITE_UPLOAD_TOKEN du dépôt}
    volumes:
      - site-data:/data
    ports:
      - "127.0.0.1:8080:8080"
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    mem_limit: 64m
volumes:
  site-data:
