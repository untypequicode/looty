# Paquet Nix et cache binaire (Cachix) : l'application de bureau et son environnement de
# développement sont construits pour x86_64 et aarch64 (vérifiés sur les pull requests) puis,
# sur main, poussés dans le cache, pour que `nix run` / `nix profile install` / `nix develop`
# téléchargent au lieu de compiler. Une nouvelle version de bureau modifie desktop/, donc passe ici.
#
# Réglages du dépôt : variable CACHIX_CACHE (nom du cache, « looty » par défaut) et secret
# CACHIX_AUTH_TOKEN. Sans jeton, les builds sont vérifiés mais rien n'est poussé.
# (L'environnement Android n'est pas poussé : le SDK n'est pas redistribuable.)
name: Nix cache

on:
  push:
    branches: [main]
    paths: ['desktop/**', 'flake.nix', 'flake.lock', '.github/workflows/nix-cache.yml']
  pull_request:
    paths: ['desktop/**', 'flake.nix', 'flake.lock', '.github/workflows/nix-cache.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.system }}
    runs-on: ${{ matrix.runner }}
    env:
      CACHIX_AUTH_TOKEN: ${{ secrets.CACHIX_AUTH_TOKEN }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - system: x86_64-linux
            runner: ubuntu-24.04
          - system: aarch64-linux
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v7
      - uses: cachix/install-nix-action@v31
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}
      # Cache pas encore configuré (secret absent) : les builds sont vérifiés sans cache.
      - name: Cachix not configured
        if: env.CACHIX_AUTH_TOKEN == '' && github.event_name != 'pull_request'
        run: echo "::notice title=Nix cache::CACHIX_AUTH_TOKEN is not set — builds run without pushing to Cachix (see RELEASING.md)."
      # Pull requests : le cache sert à télécharger, rien n'y est poussé.
      - uses: cachix/cachix-action@v17
        if: env.CACHIX_AUTH_TOKEN != ''
        with:
          name: ${{ vars.CACHIX_CACHE || 'looty' }}
          authToken: ${{ github.event_name != 'pull_request' && secrets.CACHIX_AUTH_TOKEN || '' }}
          # Rien d'autre que nos propres dérivations (nixpkgs est déjà sur cache.nixos.org).
          pushFilter: '(-source$|nixpkgs\.tar\.gz$)'
      - name: Desktop package
        run: nix build .#packages.${{ matrix.system }}.looty-desktop -L --accept-flake-config
      - name: Desktop dev shell
        run: nix build .#devShells.${{ matrix.system }}.desktop -L --no-link --accept-flake-config
      - name: Smoke test
        run: test -x result/bin/looty && test -f result/share/applications/looty.desktop
