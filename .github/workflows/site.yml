# Site de Looty (présentation, téléchargements, mises à jour, apt) : tests et image Docker.
# Image publiée sur ghcr.io/<dépôt>-site à chaque tag « site-v* » (et à la demande).
name: Site

on:
  push:
    branches: [main]
    paths: ['site/**', '.github/workflows/site.yml']
    tags: ['site-v*']
  pull_request:
    paths: ['site/**', '.github/workflows/site.yml']
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  test:
    name: Tests and build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Server tests
        working-directory: site/server
        run: cargo test --locked
      - name: Pages build
        working-directory: site/web
        run: |
          npm ci --no-audit --no-fund
          npm run build
          test -f dist/index.html && test -f dist/fr/index.html

  image:
    name: Docker image
    needs: test
    if: startsWith(github.ref, 'refs/tags/site-v') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Tags
        id: tags
        run: |
          img="ghcr.io/${GITHUB_REPOSITORY,,}-site"
          if [[ "$GITHUB_REF" == refs/tags/site-v* ]]; then echo "list=$img:latest,$img:${GITHUB_REF_NAME#site-v}" >> "$GITHUB_OUTPUT"; else echo "list=$img:latest,$img:sha-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"; fi
      - uses: docker/build-push-action@v7
        with:
          context: site
          push: true
          tags: ${{ steps.tags.outputs.list }}
          cache-from: type=gha,scope=site
          cache-to: type=gha,mode=max,scope=site
