# Remplit le site de téléchargement avec les dernières applications déjà publiées sur GitHub (lancement manuel :
# après la mise en ligne du site ou la perte de son volume, sans attendre une nouvelle version).
# Variable SITE_URL, secrets SITE_UPLOAD_TOKEN (et APT_GPG_PRIVATE_KEY pour le dépôt apt) : voir site/README.md.
name: Site sync

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sync:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Download the latest apps from GitHub
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p apps
          latest() { gh release list --limit 100 --json tagName --jq "[.[].tagName | select(startswith(\"$1-v\"))] | first // empty"; }
          for p in android desktop; do
            tag=$(latest "$p")
            [ -n "$tag" ] || { echo "::warning::no $p release"; continue; }
            gh release download "$tag" --pattern '*.apk' --pattern '*.deb' --pattern '*-setup.exe' --dir apps || true
          done
          ls -la apps
      - name: Publish
        env:
          SITE_URL: ${{ vars.SITE_URL }}
          SITE_UPLOAD_TOKEN: ${{ secrets.SITE_UPLOAD_TOKEN }}
          APT_GPG_PRIVATE_KEY: ${{ secrets.APT_GPG_PRIVATE_KEY }}
          GPG_PASSPHRASE: ${{ secrets.APT_GPG_PASSPHRASE }}
        run: |
          [ -n "$SITE_URL" ] && [ -n "$SITE_UPLOAD_TOKEN" ] || { echo "::error::SITE_URL and SITE_UPLOAD_TOKEN are required"; exit 1; }
          ./scripts/publish-apps.sh apps
