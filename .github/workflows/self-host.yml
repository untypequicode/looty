# Modèles d'installation (deploy/) : rendu Caddy et Traefik, puis les piles Caddy et Traefik démarrées pour de bon
# (images construites depuis ce commit, sur https://localhost).
name: Self-host

on:
  push:
    branches: [main]
    paths:
      - 'deploy/**'
      - 'flake.nix'
      - 'site/web/public/install.sh'
      - 'docker-compose.prod.yml'
      - 'backend/Dockerfile'
      - 'backend/src/auth.rs'
      - 'backend/src/main.rs'
      - 'frontend/Dockerfile'
      - 'collaboration/Dockerfile'
      - '.github/workflows/self-host.yml'
  pull_request:
    paths:
      - 'deploy/**'
      - 'flake.nix'
      - 'site/web/public/install.sh'
      - 'docker-compose.prod.yml'
      - 'backend/Dockerfile'
      - 'backend/src/auth.rs'
      - 'backend/src/main.rs'
      - 'frontend/Dockerfile'
      - 'collaboration/Dockerfile'
      - '.github/workflows/self-host.yml'
  workflow_dispatch:

permissions:
  contents: read

# Pull request : un nouveau push annule le run précédent. Ailleurs : groupe propre à chaque run.
concurrency:
  group: self-host-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: true

jobs:
  templates:
    name: Templates
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 26
      - name: ShellCheck
        run: |
          shellcheck deploy/render.sh deploy/install.sh deploy/test/stack.sh
          # install.sh servi par le site : copie exacte de deploy/install.sh.
          cmp deploy/install.sh site/web/public/install.sh
          rendered=$(mktemp -d)
          sh deploy/render.sh caddy "$rendered" pocket-id
          shellcheck "$rendered/pocket-id-init.sh"
      # Sorties Caddy et Traefik ; docker-compose.prod.yml doit être le rendu Traefik.
      - run: node --test deploy/test/render.test.mjs
      # install.sh en mode non interactif : mêmes fichiers que render.sh, secrets générés, refus d'écraser, --upgrade.
      - run: node --test deploy/test/install.test.mjs
      # Le générateur du site (navigateur) : mêmes fichiers que render.sh et install.sh, aux secrets près ; zip lisible.
      - run: node --test deploy/test/generator.test.mjs

  nixos:
    name: NixOS module
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: cachix/install-nix-action@v31
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}
      # Évaluation de toutes les sorties, puis le test : la machine virtuelle démarre services.looty (voir deploy/nixos/test.nix).
      - run: nix flake check --no-build
      - run: nix build .#checks.x86_64-linux.nixos-module -L --no-link

  stacks:
    name: Caddy and Traefik stacks
    needs: templates
    runs-on: ubuntu-24.04
    env:
      LOOTY_VERSION: ci
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 26
      - uses: docker/setup-buildx-action@v4
      # Backend sans TeX Live : plus rapide, et inutile pour vérifier le routage.
      - uses: docker/build-push-action@v7
        env:
          DOCKER_BUILD_RECORD_UPLOAD: false
        with:
          context: ./backend
          build-args: WITH_LATEX=0
          load: true
          tags: ghcr.io/untypequicode/looty-backend:ci
          cache-from: type=gha,scope=self-host-backend
          cache-to: type=gha,mode=max,scope=self-host-backend
      - uses: docker/build-push-action@v7
        env:
          DOCKER_BUILD_RECORD_UPLOAD: false
        with:
          context: ./frontend
          load: true
          tags: ghcr.io/untypequicode/looty-frontend:ci
          cache-from: type=gha,scope=frontend-amd64
      - uses: docker/build-push-action@v7
        env:
          DOCKER_BUILD_RECORD_UPLOAD: false
        with:
          context: ./collaboration
          load: true
          tags: ghcr.io/untypequicode/looty-collaboration:ci
          cache-from: type=gha,scope=collaboration-amd64
      # API, interface, découverte CalDAV, /collab et sa WebSocket, à travers Caddy.
      - run: sh deploy/test/stack.sh caddy
      # Avec le Pocket ID inclus : client créé par pocket-id-init, premier compte, connexion OIDC jusqu'à Looty.
      - run: sh deploy/test/stack.sh caddy pocket-id
      # Les mêmes vérifications derrière un Traefik à part (son propre projet compose, branché sur le réseau de la
      # pile) : routage par les étiquettes du compose.
      - run: sh deploy/test/stack.sh traefik
      # Avec le Pocket ID inclus : Looty joint auth.localhost par l'hôte (extra_hosts du compose rendu).
      - run: sh deploy/test/stack.sh traefik pocket-id
      # Les fichiers écrits par install.sh (non interactif), démarrés pour de bon avec le Pocket ID inclus.
      - run: LOOTY_INSTALL_SH=1 sh deploy/test/stack.sh caddy pocket-id
