# Application de bureau : .deb (Linux, testé sur une Debian 12 propre) et installateur Windows (NSIS). Vérifiés sur les
# pull requests ; publiés par « Release » (backend/releases.json), qui appelle ce workflow. Le paquet Nix est construit
# par « Nix cache ».
name: Desktop

on:
  pull_request:
    paths: ['desktop/**', '.github/workflows/desktop.yml']
  workflow_dispatch:
  # Appelé par « Release » (publication automatique depuis backend/releases.json).
  workflow_call:

permissions:
  contents: read

jobs:
  deb:
    name: Debian package
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      # Image de construction (Rust + WebKitGTK) : couches gardées dans le cache GitHub.
      - uses: docker/setup-buildx-action@v4
      - name: Builder image
        uses: docker/build-push-action@v7
        with:
          context: desktop/packaging
          file: desktop/packaging/Dockerfile.deb
          tags: looty-deb-builder
          load: true
          cache-from: type=gha,scope=deb-builder
          cache-to: type=gha,mode=max,scope=deb-builder
      # Dépendances Rust déjà compilées : seul le code de l'application est recompilé.
      - name: Cargo cache
        uses: actions/cache@v6
        with:
          path: ${{ runner.temp }}/looty-deb
          key: deb-${{ hashFiles('desktop/src-tauri/Cargo.lock', 'desktop/packaging/Dockerfile.deb') }}
          restore-keys: deb-
      - name: Build (Debian 12 container)
        env:
          LOOTY_SITE_URL: ${{ vars.SITE_URL }}
          LOOTY_DEB_SKIP_IMAGE: '1'
          LOOTY_DEB_CACHE: ${{ runner.temp }}/looty-deb
        run: |
          ./desktop/scripts/build-deb.sh
          # Le conteneur écrit en root : fichiers rendus au runner pour la sauvegarde du cache.
          sudo chown -R "$(id -u):$(id -g)" "$LOOTY_DEB_CACHE"
      - name: Install test on a clean Debian 12
        run: |
          docker run --rm -v "$PWD/desktop/dist:/dist:ro" debian:bookworm bash -euc '
            apt-get update -qq
            DEBIAN_FRONTEND=noninteractive apt-get install -y -qq --no-install-recommends /dist/*.deb
            ! ldd /usr/bin/looty | grep "not found"
            grep -q "x-scheme-handler/looty" /usr/share/applications/*.desktop'
      - uses: actions/upload-artifact@v7
        with:
          name: looty-deb
          path: desktop/dist/*.deb

  windows:
    name: Windows installer
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v7
      # L'outil de construction Tauri (cargo tauri) et les dépendances Rust sont gardés en cache.
      - name: Cache Tauri CLI
        id: cli
        uses: actions/cache@v6
        with:
          path: ~/.cargo/bin/cargo-tauri.exe
          key: tauri-cli-windows-2
      - name: Install Tauri CLI
        if: steps.cli.outputs.cache-hit != 'true'
        run: cargo install tauri-cli --version "^2" --locked
      - name: Cargo cache
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            desktop/src-tauri/target
          key: windows-${{ hashFiles('desktop/src-tauri/Cargo.lock') }}
          restore-keys: windows-
      # Installateurs des versions précédentes (dossier target en cache) retirés : seul le nouveau est publié.
      - name: Build the NSIS installer
        working-directory: desktop/src-tauri
        shell: bash
        run: |
          rm -rf target/release/bundle
          cargo tauri build --bundles nsis
      - name: Installer exists
        shell: bash
        run: ls -l desktop/src-tauri/target/release/bundle/nsis/*-setup.exe
      - uses: actions/upload-artifact@v7
        with:
          name: looty-windows
          path: desktop/src-tauri/target/release/bundle/nsis/*-setup.exe

  # Test de l'installateur sur un Windows propre : installation, lancement, proxy local,
  # session chiffrée gardée, lien looty://, lancement caché, hors ligne, désinstallation.
  # Ce qu'un runner ne voit pas est dans desktop/tests/windows/CHECKLIST.md.
  windows-smoke:
    name: Windows installer test
    needs: windows
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout: desktop/tests
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - uses: actions/download-artifact@v8
        with:
          name: looty-windows
          path: installer
      - name: Install, run and uninstall Looty
        shell: pwsh
        run: |
          $setup = Get-ChildItem installer -Filter *-setup.exe | Select-Object -First 1
          ./desktop/tests/windows/smoke.ps1 -Installer $setup.FullName -Out smoke-out
      - name: Screenshots and server log
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: windows-smoke
          path: smoke-out
