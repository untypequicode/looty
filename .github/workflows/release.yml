# Publication automatique : après chaque run « CI » réussi d'un push sur main, chaque plateforme dont la dernière
# version de backend/releases.json n'a pas encore de tag (<plateforme>-v<version>) est
# construite puis publiée sur GitHub :
#   web      → images Docker (amd64 + arm64) sur ghcr.io, docker-compose.yml (Traefik) et
#              docker-compose.caddy.yml + Caddyfile épinglés
#   desktop  → paquet .deb et installateur Windows ; le paquet Nix est épinglé dans le cache binaire
#              puis vérifié (job nix-pin, workflow « Nix cache check »)
#   android  → APK
# puis le site de téléchargement et le dépôt apt (scripts/publish-apps.sh).
# Les notes viennent de releases.json (anglais, français dépliable).
# Lancement manuel : republier une plateforme avec « force ».
#
# Tests : Release démarre quand le run « CI » d'un push sur main a réussi (workflow_run), et publie
# exactement ce commit (head_sha, sortie `sha` du plan) : la CI n'est ni relancée ni attendue par un
# runner. Un changement de releases.json (dans backend/) fait toujours vérifier tout le serveur par la
# CI. Sans version à publier, seul le plan tourne (quelques secondes). En lancement manuel, Release
# lance la CI elle-même.
name: Release

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      force:
        description: Plateformes à republier même si le tag existe (web,desktop,android)
        type: string
        required: false

permissions:
  contents: write
  packages: write
  # Lecture des runs « Nix cache » de ce commit (job plan).
  actions: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  plan:
    name: What to release
    # Seulement après une CI réussie d'un push (pas d'un lancement manuel de la CI).
    if: github.event_name == 'workflow_dispatch' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push')
    runs-on: ubuntu-24.04
    outputs:
      # Commit testé par la CI (github.sha serait le dernier commit de main, peut-être plus récent).
      sha: ${{ github.event.workflow_run.head_sha || github.sha }}
      web: ${{ steps.plan.outputs.web }}
      desktop: ${{ steps.plan.outputs.desktop }}
      android: ${{ steps.plan.outputs.android }}
      any: ${{ steps.plan.outputs.any }}
      latest_web: ${{ steps.plan.outputs.latest_web }}
      latest_desktop: ${{ steps.plan.outputs.latest_desktop }}
      latest_android: ${{ steps.plan.outputs.latest_android }}
      nix_cache: ${{ steps.nix.outputs.ran }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          fetch-depth: 0
      - id: plan
        run: node scripts/release-plan.mjs --force "${{ inputs.force }}" >> "$GITHUB_OUTPUT"
      # « Nix cache » a-t-il tourné sur ce push (desktop/, flake…) ? Il vérifie alors déjà le cache de
      # ce commit, et le job nix-verify d'ici serait un doublon. Son run est créé au moment du push,
      # donc existe déjà quand la CI est finie.
      - id: nix
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          ran=false
          if [ -n "$SHA" ] && [ -n "$(gh run list --workflow nix-cache.yml --commit "$SHA" --event push --limit 1 --json databaseId --jq '.[0].databaseId // empty')" ]; then
            ran=true
          fi
          echo "ran=$ran" >> "$GITHUB_OUTPUT"

  # Lancement manuel : la CI n'a pas précédé ce run, elle est faite ici. Après un push, la CI a déjà
  # réussi sur ce commit (déclencheur workflow_run) : job sauté.
  tests:
    name: Tests
    needs: plan
    if: github.event_name == 'workflow_dispatch' && needs.plan.outputs.any == 'true'
    uses: ./.github/workflows/ci.yml

  # tests est sauté après un push : seul un échec ou une annulation bloque.
  docker:
    name: Docker images
    needs: [plan, tests]
    if: ${{ !cancelled() && !contains(needs.*.result, 'failure') && needs.plan.outputs.web != '' }}
    uses: ./.github/workflows/docker-publish.yml
    with:
      version: ${{ needs.plan.outputs.web }}
      ref: ${{ needs.plan.outputs.sha }}
    secrets: inherit

  desktop:
    name: Desktop
    needs: [plan, tests]
    if: ${{ !cancelled() && !contains(needs.*.result, 'failure') && needs.plan.outputs.desktop != '' }}
    uses: ./.github/workflows/desktop.yml
    with:
      ref: ${{ needs.plan.outputs.sha }}
    secrets: inherit

  # Paquet Nix de la release : épinglé dans le cache binaire (jamais évincé), puis vérifié.
  # Ne bloque pas la publication : un souci de cache ouvre une issue, il n'annule pas la release.
  nix-pin:
    name: Nix pin ${{ matrix.system }}
    needs: [plan, desktop]
    if: ${{ !cancelled() && needs.plan.outputs.desktop != '' && needs.desktop.result == 'success' }}
    runs-on: ${{ matrix.runner }}
    env:
      CACHIX_AUTH_TOKEN: ${{ secrets.CACHIX_AUTH_TOKEN }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - system: x86_64-linux
            runner: ubuntu-24.04
          - system: aarch64-linux
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.plan.outputs.sha }}
      - uses: cachix/install-nix-action@v31
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}
      - uses: cachix/cachix-action@v17
        if: env.CACHIX_AUTH_TOKEN != ''
        with:
          name: ${{ vars.CACHIX_CACHE || 'looty' }}
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}
          pushFilter: '(-source$|nixpkgs\.tar\.gz$)'
      - name: Pin the release package
        if: env.CACHIX_AUTH_TOKEN != ''
        env:
          CACHE: ${{ vars.CACHIX_CACHE || 'looty' }}
          VERSION: ${{ needs.plan.outputs.desktop }}
        run: |
          out=$(nix build .#packages.${{ matrix.system }}.looty-desktop --no-link --print-out-paths --accept-flake-config)
          cachix push "$CACHE" "$out"
          cachix pin "$CACHE" "release-$VERSION-${{ matrix.system }}" "$out"

  # Sauté quand « Nix cache » a tourné sur ce push : il fait déjà cette vérification, sur ce commit.
  nix-verify:
    name: Nix cache check
    needs: [plan, nix-pin]
    if: ${{ !cancelled() && needs.nix-pin.result == 'success' && needs.plan.outputs.nix_cache != 'true' }}
    permissions:
      contents: read
      issues: write
    uses: ./.github/workflows/nix-verify.yml
    with:
      ref: ${{ needs.plan.outputs.sha }}

  android:
    name: Android
    needs: [plan, tests]
    if: ${{ !cancelled() && !contains(needs.*.result, 'failure') && needs.plan.outputs.android != '' }}
    uses: ./.github/workflows/android.yml
    with:
      ref: ${{ needs.plan.outputs.sha }}
    secrets: inherit

  publish:
    name: GitHub releases
    needs: [plan, tests, docker, desktop, android]
    # Publie ce qui a été construit, même si une autre plateforme a été sautée.
    if: always() && needs.plan.outputs.any == 'true' && !contains(needs.*.result, 'failure') && !contains(needs.*.result, 'cancelled')
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.plan.outputs.sha }}
      # Seulement le .deb et l'APK (pas les empreintes ni les traces de build Docker,
      # dont les .dockerbuild ne sont pas des archives zip et font échouer le téléchargement).
      - uses: actions/download-artifact@v8
        with:
          pattern: looty-*
          path: artifacts
      - name: Notes and files
        env:
          WEB: ${{ needs.plan.outputs.web }}
          DESKTOP: ${{ needs.plan.outputs.desktop }}
          ANDROID: ${{ needs.plan.outputs.android }}
        run: |
          mkdir -p out/web out/desktop out/android
          if [ -n "$WEB" ]; then
            node scripts/release-notes.mjs web "$WEB" > out/web/notes.md
            # Fichiers d'installation (deploy/templates) avec les images de cette version : derrière Traefik
            # (docker-compose.yml, comme avant) ou avec Caddy inclus (docker-compose.caddy.yml et son Caddyfile).
            sh deploy/render.sh traefik /tmp/traefik
            sh deploy/render.sh caddy /tmp/caddy
            pin() { sed "s/\${LOOTY_VERSION:-latest}/\${LOOTY_VERSION:-$WEB}/" "$1"; }
            pin /tmp/traefik/docker-compose.yml > out/web/docker-compose.yml
            pin /tmp/caddy/docker-compose.yml > out/web/docker-compose.caddy.yml
            cp /tmp/caddy/Caddyfile out/web/Caddyfile
            grep -q "looty-backend:\${LOOTY_VERSION:-$WEB}" out/web/docker-compose.caddy.yml
          fi
          if [ -n "$DESKTOP" ]; then
            node scripts/release-notes.mjs desktop "$DESKTOP" > out/desktop/notes.md
            # Seulement les fichiers de cette version (jamais ceux d'une version précédente restés en cache).
            find artifacts -name "*_${DESKTOP}_*.deb" -exec cp -t out/desktop/ {} +
            ls out/desktop/*.deb > /dev/null
            # Installateur Windows (peut manquer si cette plateforme a échoué : la release Linux part quand même).
            find artifacts -name "*_${DESKTOP}_*-setup.exe" -exec cp -t out/desktop/ {} + || true
            find artifacts -name "*_${DESKTOP}_*-setup.exe.sig" -exec cp -t out/desktop/ {} + || true
          fi
          if [ -n "$ANDROID" ]; then
            node scripts/release-notes.mjs android "$ANDROID" > out/android/notes.md
            find artifacts \( -name "looty-${ANDROID}.apk" -o -name "looty-${ANDROID}-debug.apk" \) -exec cp -t out/android/ {} +
            ls out/android/*.apk > /dev/null
          fi
          find out -type f | sort
      - name: Web release
        if: needs.plan.outputs.web != ''
        uses: softprops/action-gh-release@v3
        with:
          tag_name: web-v${{ needs.plan.outputs.web }}
          target_commitish: ${{ needs.plan.outputs.sha }}
          name: Looty ${{ needs.plan.outputs.web }}
          body_path: out/web/notes.md
          files: |
            out/web/docker-compose.yml
            out/web/docker-compose.caddy.yml
            out/web/Caddyfile
          make_latest: true
      - name: Desktop release
        if: needs.plan.outputs.desktop != ''
        uses: softprops/action-gh-release@v3
        with:
          tag_name: desktop-v${{ needs.plan.outputs.desktop }}
          target_commitish: ${{ needs.plan.outputs.sha }}
          name: Looty for Linux and Windows ${{ needs.plan.outputs.desktop }}
          body_path: out/desktop/notes.md
          files: |
            out/desktop/*.deb
            out/desktop/*-setup.exe
            out/desktop/*-setup.exe.sig
          make_latest: false
      # Manifeste de la mise à jour automatique Windows : une release fixe « updater » dont latest.json est remplacé
      # à chaque publication (l'application interroge toujours la même adresse).
      - name: Windows updater manifest
        if: needs.plan.outputs.desktop != ''
        env:
          GH_TOKEN: ${{ github.token }}
          DESKTOP: ${{ needs.plan.outputs.desktop }}
          SHA: ${{ needs.plan.outputs.sha }}
        run: |
          sig=$(ls out/desktop/*-setup.exe.sig 2> /dev/null | head -1 || true)
          if [ -z "$sig" ]; then echo "No updater signature (TAURI_SIGNING_PRIVATE_KEY missing): manifest not updated"; exit 0; fi
          exe=$(basename "${sig%.sig}")
          node -e '
            const fs = require("fs"), [v, exe, sigFile, repo] = process.argv.slice(1)
            fs.writeFileSync("latest.json", JSON.stringify({
              version: v, notes: "https://github.com/" + repo + "/releases/tag/desktop-v" + v, pub_date: new Date().toISOString(),
              platforms: { "windows-x86_64": { signature: fs.readFileSync(sigFile, "utf8").trim(), url: "https://github.com/" + repo + "/releases/download/desktop-v" + v + "/" + exe } },
            }, null, 2))' "$DESKTOP" "$exe" "$sig" "$GITHUB_REPOSITORY"
          gh release view updater > /dev/null 2>&1 || gh release create updater --target "$SHA" --prerelease --title "Updater manifest" --notes "Fixed address read by the Windows app to find its updates (latest.json). Do not delete."
          gh release upload updater latest.json --clobber
      - name: Android release
        if: needs.plan.outputs.android != ''
        uses: softprops/action-gh-release@v3
        with:
          tag_name: android-v${{ needs.plan.outputs.android }}
          target_commitish: ${{ needs.plan.outputs.sha }}
          name: Looty for Android ${{ needs.plan.outputs.android }}
          body_path: out/android/notes.md
          files: out/android/*.apk
          make_latest: false
      # La release principale (web, « Latest ») propose aussi les dernières applications :
      # .deb et .apk de cette exécution, sinon repris de leurs propres releases. Les
      # anciennes versions des applications y sont retirées.
      - name: Attach apps to the main release
        if: needs.plan.outputs.latest_web != ''
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          MAIN_TAG: web-v${{ needs.plan.outputs.latest_web }}
          DESKTOP_TAG: desktop-v${{ needs.plan.outputs.latest_desktop }}
          ANDROID_TAG: android-v${{ needs.plan.outputs.latest_android }}
        run: |
          if ! gh release view "$MAIN_TAG" > /dev/null 2>&1; then
            echo "::notice::$MAIN_TAG is not published yet: apps not attached"
            exit 0
          fi
          mkdir -p apps
          cp out/desktop/*.deb out/desktop/*-setup.exe out/android/*.apk apps/ 2> /dev/null || true
          # Fichiers de la dernière version seulement (une release peut garder d'anciens fichiers).
          d="${DESKTOP_TAG#desktop-v}"; a="${ANDROID_TAG#android-v}"
          ls apps/*.deb > /dev/null 2>&1 || gh release download "$DESKTOP_TAG" --pattern "*_${d}_*.deb" --dir apps || echo "::warning::no .deb found on $DESKTOP_TAG"
          ls apps/*.apk > /dev/null 2>&1 || gh release download "$ANDROID_TAG" --pattern "looty-${a}*.apk" --dir apps || echo "::warning::no .apk found on $ANDROID_TAG"
          ls apps/*-setup.exe > /dev/null 2>&1 || gh release download "$DESKTOP_TAG" --pattern "*_${d}_*-setup.exe" --dir apps 2> /dev/null || true
          ls -la apps
          # Anciennes versions des applications retirées de la release principale.
          for old in $(gh release view "$MAIN_TAG" --json assets --jq '.assets[].name | select(endswith(".deb") or endswith(".apk") or endswith("-setup.exe"))'); do
            case "$old" in *.deb|*.apk|*-setup.exe) ;; *) continue ;; esac
            [ -e "apps/$old" ] || gh release delete-asset "$MAIN_TAG" "$old" --yes
          done
          if compgen -G 'apps/*' > /dev/null; then
            gh release upload "$MAIN_TAG" apps/* --clobber
          fi
      # Site de téléchargement facultatif (variable SITE_URL, secret SITE_UPLOAD_TOKEN ; voir site/README.md) et dépôt apt
      # signé (si la clé APT_GPG_PRIVATE_KEY existe) : sur le site s'il est configuré, sinon sur GitHub Pages.
      - name: Publish to the download site and apt
        env:
          SITE_URL: ${{ vars.SITE_URL }}
          SITE_UPLOAD_TOKEN: ${{ secrets.SITE_UPLOAD_TOKEN }}
          APT_GPG_PRIVATE_KEY: ${{ secrets.APT_GPG_PRIVATE_KEY }}
          GPG_PASSPHRASE: ${{ secrets.APT_GPG_PASSPHRASE }}
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p publish
          find out/desktop out/android -type f ! -name notes.md -exec cp -t publish/ {} +
          ./scripts/publish-apps.sh publish
