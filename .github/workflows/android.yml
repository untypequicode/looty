# Application Android : APK signé (sans Google), publié sur les tags android-v*.
# Secrets : ANDROID_KEYSTORE_B64 (keystore en base64), ANDROID_KEYSTORE_PASSWORD,
# ANDROID_KEY_ALIAS, ANDROID_KEY_PASSWORD. Sans eux : APK de debug seulement.
name: Android

on:
  push:
    tags: ['android-v*']
  pull_request:
    paths: ['android/**', '.github/workflows/android.yml']
  workflow_dispatch:
  # Appelé par « Release » (publication automatique depuis backend/releases.json).
  workflow_call:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v6
      - name: Tag matches versionName
        if: startsWith(github.ref, 'refs/tags/android-v')
        run: |
          tag="${GITHUB_REF_NAME#android-v}"
          name=$(grep -m1 'versionName =' app/build.gradle.kts | cut -d'"' -f2)
          echo "tag=$tag versionName=$name"; test "$tag" = "$name"
      - name: Keystore
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        if: env.KEYSTORE_B64 != ''
        run: |
          # Seuls les caractères base64 sont gardés : un « % » final (zsh), des espaces ou
          # des retours à la ligne copiés avec la valeur ne cassent pas le décodage.
          printf '%s' "$KEYSTORE_B64" | tr -cd 'A-Za-z0-9+/=' | base64 -d > release.jks \
            || { echo "::error title=Android signing::ANDROID_KEYSTORE_B64 is not valid base64 (set it with: base64 -w0 looty-release.jks | gh secret set ANDROID_KEYSTORE_B64)"; exit 1; }
          # Mot de passe et alias vérifiés tout de suite, avec un message clair.
          keytool -list -keystore release.jks -storepass "$STORE_PASSWORD" -alias "$KEY_ALIAS" > /dev/null \
            || { echo "::error title=Android signing::the keystore does not open with ANDROID_KEYSTORE_PASSWORD, or has no key named ANDROID_KEY_ALIAS"; exit 1; }
          # Valeurs écrites telles quelles (pas d'interprétation de $, ` ou \ par le shell).
          {
            echo "storeFile=release.jks"
            printf 'storePassword=%s\n' "${STORE_PASSWORD//\\/\\\\}"
            printf 'keyAlias=%s\n' "${KEY_ALIAS//\\/\\\\}"
            printf 'keyPassword=%s\n' "${KEY_PASSWORD//\\/\\\\}"
          } > keystore.properties
      - run: ./gradlew --no-daemon assembleDebug assembleRelease
      - name: Collect
        run: |
          mkdir -p ../dist
          v=$(grep -m1 'versionName =' app/build.gradle.kts | cut -d'"' -f2)
          # APK signé si le keystore est configuré, sinon APK de debug (installable, mais pas
          # en mise à jour d'une version signée).
          if [ -f app/build/outputs/apk/release/app-release.apk ]; then
            cp app/build/outputs/apk/release/app-release.apk "../dist/looty-$v.apk"
          else
            cp app/build/outputs/apk/debug/app-debug.apk "../dist/looty-$v-debug.apk"
          fi
          ls -la ../dist
      - uses: actions/upload-artifact@v7
        with:
          name: looty-android
          path: dist/*.apk
      # Site de téléchargement (le dépôt peut être privé) : variable SITE_URL et secret SITE_UPLOAD_TOKEN ; sans eux, ignoré.
      - name: Publish to the download site
        if: startsWith(github.ref, 'refs/tags/android-v')
        working-directory: ${{ github.workspace }}
        env:
          SITE_URL: ${{ vars.SITE_URL }}
          SITE_UPLOAD_TOKEN: ${{ secrets.SITE_UPLOAD_TOKEN }}
        run: |
          apk=$(ls dist/looty-[0-9]*.apk | grep -v -- '-debug' | head -1 || true)
          if [ -n "$apk" ]; then ./scripts/site-publish.sh android "$apk"; else echo "unsigned build: not published on the site"; fi
      - name: Release
        if: startsWith(github.ref, 'refs/tags/android-v')
        uses: softprops/action-gh-release@v3
        with:
          files: dist/looty-[0-9]*.apk
