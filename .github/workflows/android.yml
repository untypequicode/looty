# Application Android : APK signé (sans Google), publié sur les tags android-v*.
# Secrets : ANDROID_KEYSTORE_B64 (keystore en base64), ANDROID_KEYSTORE_PASSWORD,
# ANDROID_KEY_ALIAS, ANDROID_KEY_PASSWORD. Sans eux : APK de debug seulement.
name: Android

on:
  push:
    tags: ['android-v*']
  pull_request:
    paths: ['android/**', '.github/workflows/android.yml']
  workflow_dispatch:
  # Appelé par « Release » (publication automatique depuis backend/releases.json).
  workflow_call:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Tag matches versionName
        if: startsWith(github.ref, 'refs/tags/android-v')
        run: |
          tag="${GITHUB_REF_NAME#android-v}"
          name=$(grep -m1 'versionName =' app/build.gradle.kts | cut -d'"' -f2)
          echo "tag=$tag versionName=$name"; test "$tag" = "$name"
      - name: Keystore
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
        if: env.KEYSTORE_B64 != ''
        run: |
          echo "$KEYSTORE_B64" | base64 -d > release.jks
          cat > keystore.properties <<PROPS
          storeFile=release.jks
          storePassword=${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          keyAlias=${{ secrets.ANDROID_KEY_ALIAS }}
          keyPassword=${{ secrets.ANDROID_KEY_PASSWORD }}
          PROPS
      - run: ./gradlew --no-daemon assembleDebug assembleRelease
      - name: Collect
        run: |
          mkdir -p ../dist
          v=$(grep -m1 'versionName =' app/build.gradle.kts | cut -d'"' -f2)
          # APK signé si le keystore est configuré, sinon APK de debug (installable, mais pas
          # en mise à jour d'une version signée).
          if [ -f app/build/outputs/apk/release/app-release.apk ]; then
            cp app/build/outputs/apk/release/app-release.apk "../dist/looty-$v.apk"
          else
            cp app/build/outputs/apk/debug/app-debug.apk "../dist/looty-$v-debug.apk"
          fi
          ls -la ../dist
      - uses: actions/upload-artifact@v4
        with:
          name: looty-android
          path: dist/*.apk
      - name: Release
        if: startsWith(github.ref, 'refs/tags/android-v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/looty-[0-9]*.apk
