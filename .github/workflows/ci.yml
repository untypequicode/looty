# Vérifications du serveur (backend, interface, collaboration) sur les pull requests et sur main.
# Aussi appelé par « Release » avant toute publication. Les applications ont leurs propres workflows
# (Android, Desktop, Nix cache, Site), lancés quand leurs dossiers changent.
#
# Le workflow tourne sur chaque pull request, même sans changement du serveur : ses jobs sont obligatoires
# pour fusionner dans main (règle « main: CI required »). Le job `changes` regarde les dossiers modifiés ;
# sans changement du serveur, les vérifications sont sautées, ce que GitHub compte comme réussi.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_call:
    inputs:
      all:
        description: Tout vérifier, quels que soient les fichiers modifiés (appel par « Release »)
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  changes:
    name: Changed paths
    runs-on: ubuntu-24.04
    outputs:
      server: ${{ steps.diff.outputs.server }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - id: diff
        env:
          EVENT: ${{ github.event_name }}
          ALL: ${{ inputs.all }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
        run: |
          if [ "$ALL" = "true" ] || [ "$EVENT" = "workflow_dispatch" ]; then echo server=true >> "$GITHUB_OUTPUT"; exit 0; fi
          if [ "$EVENT" = "pull_request" ]; then base=$(git merge-base "$PR_BASE" HEAD); else base="$PUSH_BEFORE"; fi
          # Premier push d'une branche ou commit de base introuvable : tout vérifier.
          if [ -z "$base" ] || ! git cat-file -e "$base^{commit}" 2>/dev/null; then echo server=true >> "$GITHUB_OUTPUT"; exit 0; fi
          git diff --name-only "$base" HEAD | tee /tmp/changed
          if grep -qE '^(backend|frontend|collaboration|e2e|scripts)/|^\.github/workflows/ci\.yml$' /tmp/changed; then
            echo server=true >> "$GITHUB_OUTPUT"
          else
            echo server=false >> "$GITHUB_OUTPUT"
          fi

  backend:
    name: Backend tests
    needs: changes
    if: needs.changes.outputs.server == 'true'
    runs-on: ubuntu-24.04
    # Les tests du mode démo (#[sqlx::test]) ont besoin de PostgreSQL.
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_HOST_AUTH_METHOD: trust
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgres://postgres@127.0.0.1:5432/postgres
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: backend
      # Les tests vérifient aussi releases.json (notes EN/FR, versions des applications).
      - run: cargo test --locked --manifest-path backend/Cargo.toml

  frontend:
    name: Frontend build
    needs: changes
    if: needs.changes.outputs.server == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Translations (French and English)
        run: node scripts/check-i18n.mjs
      - working-directory: frontend
        run: npm ci --no-audit --no-fund
      - name: Type check
        working-directory: frontend
        env:
          NODE_OPTIONS: --max-old-space-size=6144
        run: npm run typecheck
      - working-directory: frontend
        env:
          NODE_OPTIONS: --max-old-space-size=4096
        run: npm run build

  collaboration:
    name: Collaboration server
    needs: changes
    if: needs.changes.outputs.server == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: collaboration/package-lock.json
      - working-directory: collaboration
        run: |
          npm ci --omit=dev --no-audit --no-fund
          node --check index.js && node --check notebook.js
          node --test
          node -e "require('@hocuspocus/server'); require('@hocuspocus/extension-database'); require('pg'); require('yjs')"

  e2e:
    name: Browser tests
    needs: changes
    if: needs.changes.outputs.server == 'true'
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_DB: looty_db
          POSTGRES_USER: postgres
          POSTGRES_HOST_AUTH_METHOD: trust
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres -d looty_db" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgres://postgres@127.0.0.1:5432/looty_db
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: backend
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            collaboration/package-lock.json
            e2e/package-lock.json
      - run: cargo build --locked --manifest-path backend/Cargo.toml
      - working-directory: frontend
        run: npm ci --no-audit --no-fund
      # Les cibles du relais /api et /collab sont fixées à la construction.
      - working-directory: frontend
        env:
          NODE_OPTIONS: --max-old-space-size=4096
          BACKEND_URL: http://127.0.0.1:8080
          COLLAB_URL: http://127.0.0.1:8082
        run: npm run build
      - working-directory: collaboration
        run: npm ci --omit=dev --no-audit --no-fund
      - working-directory: e2e
        run: |
          npm ci --no-audit --no-fund
          npx playwright-core install --with-deps chromium
      # Serveur Jupyter local pour tests/notebook-jupyter.mjs (exécution à distance).
      - run: python3 -m venv /tmp/jupyter && /tmp/jupyter/bin/pip install --quiet jupyter_server ipykernel
      - name: Start the stack
        run: |
          (cd backend && PORT=8080 BASE_URL=http://localhost:3000 LOOTY_DEV_LOGIN=true CALDAV_ALLOW_PRIVATE=true JUPYTER_ALLOW_PRIVATE=true CALENDAR_DEFAULT_TZ=Europe/Paris nohup ./target/debug/backend > ../backend.log 2>&1 &)
          (cd collaboration && PORT=8082 BACKEND_URL=http://127.0.0.1:8080 nohup node index.js > ../collab.log 2>&1 &)
          (mkdir -p /tmp/nb && cd /tmp/nb && nohup /tmp/jupyter/bin/jupyter server --no-browser --ServerApp.ip=127.0.0.1 --ServerApp.port=18888 --IdentityProvider.token=e2e-jupyter-token > "$GITHUB_WORKSPACE/jupyter.log" 2>&1 &)
          (cd frontend && PORT=3000 BACKEND_URL=http://127.0.0.1:8080 COLLAB_URL=http://127.0.0.1:8082 nohup node .output/server/index.mjs > ../front.log 2>&1 &)
          for i in $(seq 1 60); do curl -fs http://127.0.0.1:3000/api/auth/providers >/dev/null 2>&1 && curl -fs -o /dev/null http://127.0.0.1:3000/ && curl -fs -o /dev/null -H "Authorization: token e2e-jupyter-token" http://127.0.0.1:18888/api/kernelspecs && break; sleep 1; done
      - working-directory: e2e
        env:
          E2E_BASE: http://localhost:3000
          E2E_JUPYTER_URL: http://127.0.0.1:18888
          E2E_JUPYTER_TOKEN: e2e-jupyter-token
        run: node run.mjs
      - name: Server logs
        if: failure()
        run: tail -n 60 backend.log collab.log front.log jupyter.log
      - name: Screenshots
        if: failure()
        uses: actions/upload-artifact@v5
        with:
          name: e2e-screenshots
          path: e2e/out
          if-no-files-found: ignore
