# Vérifications du serveur (backend, interface, collaboration) sur les pull requests et sur main.
# Aussi appelé par « Release » avant toute publication. Les applications ont leurs propres workflows
# (Android, Desktop, Nix cache, Site), lancés quand leurs dossiers changent.
name: CI

on:
  push:
    branches: [main]
    paths: ['backend/**', 'frontend/**', 'collaboration/**', 'scripts/**', '.github/workflows/ci.yml']
  pull_request:
    paths: ['backend/**', 'frontend/**', 'collaboration/**', 'scripts/**', '.github/workflows/ci.yml']
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: backend
      # Les tests vérifient aussi releases.json (notes EN/FR, versions des applications).
      - run: cargo test --locked --manifest-path backend/Cargo.toml

  frontend:
    name: Frontend build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Translations (French and English)
        run: node scripts/check-i18n.mjs
      - working-directory: frontend
        run: npm ci --no-audit --no-fund
      - working-directory: frontend
        env:
          NODE_OPTIONS: --max-old-space-size=4096
        run: npm run build

  collaboration:
    name: Collaboration server
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: collaboration/package-lock.json
      - working-directory: collaboration
        run: |
          npm ci --omit=dev --no-audit --no-fund
          node --check index.js
          node -e "require('@hocuspocus/server'); require('@hocuspocus/extension-database'); require('pg'); require('yjs')"
