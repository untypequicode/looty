<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Looty</title>
<style>
  :root { color-scheme: light dark; --bg: #fbfbfc; --panel: #fff; --text: #1b1b1f; --muted: #6b6b76; --border: #e4e4e8; --accent: #5e6ad2; --red: #d64545; }
  @media (prefers-color-scheme: dark) { :root { --bg: #0e0e11; --panel: #18181c; --text: #ececf1; --muted: #8a8a96; --border: #2a2a31; --accent: #7170ff; } }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: var(--bg); color: var(--text); font: 14px/1.5 Inter, -apple-system, "Segoe UI", Roboto, Cantarell, "Noto Sans", sans-serif; }
  main { width: min(420px, calc(100vw - 32px)); background: var(--panel); border: 1px solid var(--border); border-radius: 12px; padding: 32px 28px; }
  .logo { width: 44px; height: 44px; border-radius: 11px; background: var(--accent); color: #fff; display: grid; place-items: center; font-weight: 700; font-size: 22px; margin-bottom: 18px; }
  h1 { font-size: 20px; margin: 0 0 6px; letter-spacing: -0.01em; }
  p { margin: 0 0 20px; color: var(--muted); }
  label { display: block; font-weight: 500; margin-bottom: 6px; }
  input { width: 100%; height: 38px; padding: 0 12px; border-radius: 8px; border: 1px solid var(--border); background: transparent; color: var(--text); font: inherit; outline: none; }
  input:focus { border-color: var(--accent); box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 25%, transparent); }
  button { margin-top: 16px; width: 100%; height: 38px; border: 0; border-radius: 8px; background: var(--accent); color: #fff; font: inherit; font-weight: 600; cursor: pointer; }
  button:disabled { opacity: .6; cursor: progress; }
  .err { color: var(--red); margin-top: 12px; min-height: 1.5em; }
</style>
</head>
<body>
<main>
  <div class="logo">L</div>
  <h1 data-i18n="title">Connect to your Looty</h1>
  <p data-i18n="intro">Enter the address of your team's Looty server.</p>
  <form id="f">
    <label for="server" data-i18n="label">Server address</label>
    <input id="server" type="text" placeholder="looty.example.com" autocomplete="url" autofocus required>
    <button id="go" type="submit" data-i18n="connect">Connect</button>
    <div class="err" id="err"></div>
  </form>
</main>
<script>
  const fr = (navigator.language || '').toLowerCase().startsWith('fr')
  const T = fr ? {
    title: 'Connexion à votre Looty', intro: 'Saisissez l’adresse du serveur Looty de votre équipe.', label: 'Adresse du serveur', connect: 'Se connecter',
    invalid_url: 'Adresse invalide.', unreachable: 'Serveur injoignable. Vérifiez l’adresse et votre connexion.', not_looty: 'Ce serveur ne répond pas comme un serveur Looty.', checking: 'Vérification…',
  } : {
    title: 'Connect to your Looty', intro: 'Enter the address of your team\'s Looty server.', label: 'Server address', connect: 'Connect',
    invalid_url: 'Invalid address.', unreachable: 'Server unreachable. Check the address and your connection.', not_looty: 'This server doesn\'t respond like a Looty server.', checking: 'Checking…',
  }
  document.documentElement.lang = fr ? 'fr' : 'en'
  document.querySelectorAll('[data-i18n]').forEach((el) => { el.textContent = T[el.dataset.i18n] })
  const f = document.getElementById('f'), go = document.getElementById('go'), err = document.getElementById('err')
  f.addEventListener('submit', async (e) => {
    e.preventDefault()
    go.disabled = true; go.textContent = T.checking; err.textContent = ''
    try {
      const r = await fetch('/__looty/setup', { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify({ server: document.getElementById('server').value }) })
      const j = await r.json()
      if (!r.ok) throw new Error(T[j.error] || j.error)
      location.href = '/'
    } catch (x) {
      err.textContent = x.message
      go.disabled = false; go.textContent = T.connect
    }
  })
</script>
</body>
</html>
