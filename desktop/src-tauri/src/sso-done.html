<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Looty</title>
<style>
  :root { color-scheme: light dark; --bg: #fbfbfc; --text: #1b1b1f; --muted: #6b6b76; --ok: #4cb782; --err: #d64545; }
  @media (prefers-color-scheme: dark) { :root { --bg: #0e0e11; --text: #ececf1; --muted: #8a8a96; } }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: var(--bg); color: var(--text); font: 15px/1.5 Inter, -apple-system, "Segoe UI", Cantarell, "Noto Sans", sans-serif; text-align: center; }
  .mark { width: 48px; height: 48px; border-radius: 50%; display: grid; place-items: center; margin: 0 auto 14px; color: #fff; font-size: 26px; font-weight: 700; }
  .ok .mark { background: var(--ok); } .err .mark { background: var(--err); }
  h1 { font-size: 20px; margin: 0 0 6px; } p { color: var(--muted); margin: 0; }
</style>
</head>
<body class="{{ok}}">
<div>
  <div class="mark">{{ok}}</div>
  <h1>{{title}}</h1>
  <p>{{text}}</p>
</div>
<script>
  const m = document.querySelector('.mark'); m.textContent = document.body.className === 'ok' ? '✓' : '!'
  if (document.body.className === 'ok') setTimeout(() => window.close(), 1500)
</script>
</body>
</html>
