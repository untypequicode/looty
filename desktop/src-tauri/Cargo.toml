[package]
name = "looty-desktop"
version = "0.8.0"
description = "Looty desktop app"
edition = "2021"
license = "MIT"
authors = ["Looty contributors"]
default-run = "looty"

[[bin]]
name = "looty"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-single-instance = "2"
tauri-plugin-opener = "2"
axum = { version = "0.8", features = ["ws"] }
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.13", default-features = false, features = ["rustls", "stream", "cookies", "json"] }
reqwest_cookie_store = "0.10"
cookie_store = "0.22"
tokio-tungstenite = { version = "0.30", features = ["rustls-tls-webpki-roots"] }
futures-util = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
dirs = "7"
url = "2"
rand = "0.10"
hex = "0.4"
sha2 = "0.11"
notify-rust = "4"
uuid = { version = "1", features = ["v4"] }
chrono = { version = "0.4", features = ["clock", "serde"] }
base64 = "0.23"
bytes = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
aes-gcm = "0.11"

# --- Linux ---------------------------------------------------------------------
[target.'cfg(target_os = "linux")'.dependencies]
keyring = { version = "3", features = ["async-secret-service", "tokio", "crypto-rust"] }
# Mêmes versions que Tauri / wry : fenêtre « Enregistrer sous » et correcteur orthographique.
gtk = "0.18"
webkit2gtk = { version = "2.0", features = ["v2_40"] }
# Raccourcis globaux (portail XDG GlobalShortcuts : GNOME, KDE, Hyprland, sous Wayland comme X11).
ashpd = { version = "0.13", default-features = false, features = ["tokio", "global_shortcuts"] }

# --- Windows -------------------------------------------------------------------
[target.'cfg(windows)'.dependencies]
# Gestionnaire d'identifiants Windows pour la clé de chiffrement de la session.
keyring = { version = "3", features = ["windows-native"] }
# Notifications (toasts) avec boutons et clic.
tauri-winrt-notification = "0.8"
tauri-plugin-global-shortcut = "2"
# Mises à jour automatiques de l'installateur (signées, gratuites ; voir selfupdate.rs).
tauri-plugin-updater = "2"
# Fenêtre « Enregistrer sous » native.
rfd = { version = "0.17", default-features = false }

[profile.release]
# LTO « thin » : presque le même binaire qu'en LTO complet, construit bien plus vite.
lto = "thin"
strip = true
opt-level = "s"
