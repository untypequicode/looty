[package]
name = "looty-desktop"
version = "0.3.0"
description = "Looty desktop app"
edition = "2021"
license = "MIT"
authors = ["Looty contributors"]
default-run = "looty"

[[bin]]
name = "looty"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-single-instance = "2"
tauri-plugin-opener = "2"
axum = { version = "0.7", features = ["ws"] }
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "stream", "cookies", "json"] }
reqwest_cookie_store = "0.8"
cookie_store = "0.21"
tokio-tungstenite = { version = "0.24", features = ["rustls-tls-webpki-roots"] }
futures-util = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
dirs = "5"
url = "2"
rand = "0.8"
hex = "0.4"
sha2 = "0.10"
notify-rust = "4"
uuid = { version = "1", features = ["v4"] }
chrono = { version = "0.4", features = ["clock", "serde"] }
base64 = "0.22"
bytes = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
keyring = { version = "3", features = ["async-secret-service", "tokio", "crypto-rust"] }
aes-gcm = "0.10"
# Mêmes versions que Tauri / wry : fenêtre « Enregistrer sous » et correcteur orthographique.
gtk = "0.18"
webkit2gtk = { version = "2.0", features = ["v2_40"] }

[profile.release]
lto = true
codegen-units = 1
strip = true
opt-level = "s"
