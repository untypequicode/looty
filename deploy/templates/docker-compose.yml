# Installation de Looty (https://github.com/untypequicode/looty). Les réglages de l'instance sont dans .env.
# Produit par deploy/render.sh à partir de deploy/templates/docker-compose.yml : modifier le modèle, pas ce fichier.
services:
  postgres:
    image: postgres:18-alpine
    # Réglages sobres (mem_limit 768m) : le défaut de Postgres vise une machine dédiée.
    command: ["postgres", "-c", "shared_buffers=96MB", "-c", "max_connections=40", "-c", "work_mem=4MB", "-c", "maintenance_work_mem=48MB", "-c", "effective_cache_size=384MB"]
    environment:
      POSTGRES_DB: ${DB_NAME:-looty_db}
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
    volumes:
      # Les données sont dans le dossier ./data/postgres (à côté de ce fichier) ; LOOTY_DB_DATA=/chemin/absolu les place ailleurs.
      # Depuis la 0.30 : plus de volume nommé. Si Looty tourne déjà avec le volume postgres_data_18, déplacez-le (README, « Move the database »).
      - ${LOOTY_DB_DATA:-./data/postgres}:/var/lib/postgresql
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${DB_USER:-postgres} -d ${DB_NAME:-looty_db}",
        ]
      interval: 5s
      timeout: 5s
      retries: 5
    mem_limit: 768m
    restart: unless-stopped

  backend:
    image: ghcr.io/untypequicode/looty-backend:${LOOTY_VERSION:-latest}
    environment:
      DATABASE_URL: postgres://${DB_USER:-postgres}:${DB_PASSWORD:-postgres}@postgres:5432/${DB_NAME:-looty_db}
      # Clé de chiffrement des mots de passe CalDAV (recommandé ; sinon générée dans uploads/.secret.key)
      LOOTY_SECRET_KEY: ${LOOTY_SECRET_KEY:-}
      # Autorise les serveurs CalDAV sur le réseau local / http (ex. Nextcloud interne)
      CALDAV_ALLOW_PRIVATE: ${CALDAV_ALLOW_PRIVATE:-false}
      # Autorise les serveurs Jupyter des notebooks sur le réseau local / http
      JUPYTER_ALLOW_PRIVATE: ${JUPYTER_ALLOW_PRIVATE:-false}
      # Démo publique : voir .env.example (jamais sur une vraie instance).
      LOOTY_DEMO: ${LOOTY_DEMO:-false}
      LOOTY_DEMO_MAX_COPIES: ${LOOTY_DEMO_MAX_COPIES:-30}
      LOOTY_DEMO_COPIES_PER_IP_HOUR: ${LOOTY_DEMO_COPIES_PER_IP_HOUR:-5}
      LOOTY_DEMO_MAX_FILE_MB: ${LOOTY_DEMO_MAX_FILE_MB:-2}
      LOOTY_DEMO_MAX_COPY_MB: ${LOOTY_DEMO_MAX_COPY_MB:-20}
      # Comptes locaux (déconseillés, désactivés par défaut) : voir .env.example.
      LOOTY_LOCAL_ACCOUNTS: ${LOOTY_LOCAL_ACCOUNTS:-false}
      LOOTY_TUNNELS: ${LOOTY_TUNNELS:-off}
      LOOTY_LOCAL_SIGNUP: ${LOOTY_LOCAL_SIGNUP:-closed}
      # E-mails : à configurer dans Administration > E-mail, ou ici (repli).
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-}
      SMTP_SECURITY: ${SMTP_SECURITY:-}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:-}
      SMTP_FROM_NAME: ${SMTP_FROM_NAME:-}
#@if turn
      # Relais TURN (service coturn ci-dessous) : secret partagé et adresses données aux navigateurs pour les appels.
      LOOTY_TURN_SECRET: ${TURN_SECRET:?TURN_SECRET must be set in .env}
      LOOTY_TURN_URLS: "turn:${APP_DOMAIN:?APP_DOMAIN must be set in .env}:3478?transport=udp,turn:${APP_DOMAIN}:3478?transport=tcp"
#@end
      PORT: 8080
      OIDC_ISSUER: ${OIDC_ISSUER}
      OIDC_CLIENT_ID: ${OIDC_CLIENT_ID}
      OIDC_CLIENT_SECRET: ${OIDC_CLIENT_SECRET}
      OIDC_PROVIDER_ID: ${OIDC_PROVIDER_ID:-}
      BASE_URL: ${BASE_URL:-http://localhost:3000}
    volumes:
      - ./backend/uploads:/app/uploads
      - ./backend/backups:/app/backups
    depends_on:
      postgres:
        condition: service_healthy
#@if traefik
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.${APP_NAME}-api.rule=Host(`${APP_DOMAIN}`) && (PathPrefix(`/api`) || PathPrefix(`/uploads`) || PathPrefix(`/pages`) || PathPrefix(`/dav`) || Path(`/.well-known/caldav`))"
      - "traefik.http.services.${APP_NAME}-api.loadbalancer.server.port=8080"
#@end
#@if traefik entrypoint
      - "traefik.http.routers.${APP_NAME}-api.entrypoints=${TRAEFIK_ENTRYPOINT:?TRAEFIK_ENTRYPOINT must be set in .env}"
#@end
#@if traefik resolver
      - "traefik.http.routers.${APP_NAME}-api.tls.certresolver=${TRAEFIK_CERT_RESOLVER:?TRAEFIK_CERT_RESOLVER must be set in .env}"
#@end
#@if traefik network
      - "traefik.docker.network=${TRAEFIK_NETWORK:?TRAEFIK_NETWORK must be set in .env}"
#@end
#@if traefik pocket-id
    # Looty joint le fournisseur inclus par son adresse publique (https://AUTH_DOMAIN) : ce nom mène à l'hôte,
    # où Traefik écoute sur le port 443, sans dépendre d'un aller-retour par l'adresse publique du serveur.
    extra_hosts:
      - "${AUTH_DOMAIN:?AUTH_DOMAIN must be set in .env}:host-gateway"
#@end
    # Nom unique pour les appels entre services : sur un réseau Docker partagé entre piles, « backend » désignerait aussi
    # celui des autres piles.
    networks:
      default:
        aliases:
          - ${APP_NAME:-looty}-backend
#@if traefik network
      proxy:
#@end
    mem_limit: 1024m
    restart: unless-stopped

  collaboration:
    image: ghcr.io/untypequicode/looty-collaboration:${LOOTY_VERSION:-latest}
    environment:
      DATABASE_URL: postgres://${DB_USER:-postgres}:${DB_PASSWORD:-postgres}@postgres:5432/${DB_NAME:-looty_db}
      BACKEND_URL: http://${APP_NAME:-looty}-backend:8080
    depends_on:
      postgres:
        condition: service_healthy
#@if traefik
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.${APP_NAME}-collab.rule=Host(`${APP_DOMAIN}`) && PathPrefix(`/collab`)"
      - "traefik.http.middlewares.${APP_NAME}-collab-strip.stripprefix.prefixes=/collab"
      - "traefik.http.routers.${APP_NAME}-collab.middlewares=${APP_NAME}-collab-strip"
      - "traefik.http.services.${APP_NAME}-collab.loadbalancer.server.port=8082"
#@end
#@if traefik entrypoint
      - "traefik.http.routers.${APP_NAME}-collab.entrypoints=${TRAEFIK_ENTRYPOINT:?TRAEFIK_ENTRYPOINT must be set in .env}"
#@end
#@if traefik resolver
      - "traefik.http.routers.${APP_NAME}-collab.tls.certresolver=${TRAEFIK_CERT_RESOLVER:?TRAEFIK_CERT_RESOLVER must be set in .env}"
#@end
#@if traefik network
      - "traefik.docker.network=${TRAEFIK_NETWORK:?TRAEFIK_NETWORK must be set in .env}"
#@end
    networks:
      default:
        aliases:
          - ${APP_NAME:-looty}-collaboration
#@if traefik network
      proxy:
#@end
    mem_limit: 512m
    restart: unless-stopped
    stop_grace_period: 30s

  frontend:
    image: ghcr.io/untypequicode/looty-frontend:${LOOTY_VERSION:-latest}
    environment:
      BACKEND_URL: http://${APP_NAME:-looty}-backend:8080
      COLLAB_URL: http://${APP_NAME:-looty}-collaboration:8082
#@if traefik
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.${APP_NAME}-web.rule=Host(`${APP_DOMAIN}`)"
      - "traefik.http.services.${APP_NAME}-web.loadbalancer.server.port=3000"
#@end
#@if traefik entrypoint
      - "traefik.http.routers.${APP_NAME}-web.entrypoints=${TRAEFIK_ENTRYPOINT:?TRAEFIK_ENTRYPOINT must be set in .env}"
#@end
#@if traefik resolver
      - "traefik.http.routers.${APP_NAME}-web.tls.certresolver=${TRAEFIK_CERT_RESOLVER:?TRAEFIK_CERT_RESOLVER must be set in .env}"
#@end
#@if traefik network
      - "traefik.docker.network=${TRAEFIK_NETWORK:?TRAEFIK_NETWORK must be set in .env}"
#@end
#@if traefik network
    networks:
      - default
      - proxy
#@end
    mem_limit: 384m
    restart: unless-stopped
#@if caddy

  # HTTPS automatique (Let's Encrypt) pour APP_DOMAIN ; le routage est dans le Caddyfile, à côté de ce fichier.
  # Les certificats sont gardés dans ./data/caddy. Les ports 80 et 443 de l'hôte doivent être libres.
  caddy:
    image: caddy:2-alpine
    environment:
      APP_DOMAIN: ${APP_DOMAIN:?APP_DOMAIN must be set in .env}
      # Domaine du fournisseur OIDC inclus (Pocket ID) ; vide sans lui.
      AUTH_DOMAIN: ${AUTH_DOMAIN:-}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./data/caddy:/data
      - ./data/caddy-config:/config
    depends_on:
      - backend
      - collaboration
      - frontend
    mem_limit: 128m
    restart: unless-stopped
#@end
#@if caddy pocket-id
    networks:
      default:
        # Looty joint le fournisseur inclus par son adresse publique (https://AUTH_DOMAIN) : sur le réseau
        # Docker, ce nom mène directement à Caddy, sans dépendre d'un aller-retour par l'hôte.
        aliases:
          - ${AUTH_DOMAIN:?AUTH_DOMAIN must be set in .env}
#@end
#@if pocket-id

  # Fournisseur OIDC inclus : Pocket ID (connexion par passkey), servi sur https://AUTH_DOMAIN (un sous-domaine :
  # Pocket ID ne fonctionne pas sous un chemin). Ses données sont dans ./data/pocket-id.
  # Premier compte, juste après le premier démarrage : https://AUTH_DOMAIN/setup. Il devient admin de Pocket ID,
  # puis de Looty à sa première connexion (le premier compte de Looty en est l'administrateur).
  pocket-id:
    image: ghcr.io/pocket-id/pocket-id:v2.19.2
    environment:
      APP_URL: https://${AUTH_DOMAIN:?AUTH_DOMAIN must be set in .env}
      ENCRYPTION_KEY: ${POCKET_ID_ENCRYPTION_KEY:?POCKET_ID_ENCRYPTION_KEY must be set in .env}
      # Clé d'administration utilisée par pocket-id-init. Une fois le client créé, elle peut être retirée de .env.
      STATIC_API_KEY: ${POCKET_ID_STATIC_API_KEY:-}
      # Joignable seulement à travers le proxy, sur le réseau Docker.
      TRUST_PROXY: "true"
      ALLOW_INSECURE_CALLBACK_URLS: "false"
      ANALYTICS_DISABLED: "true"
    volumes:
      - ./data/pocket-id:/app/data
    healthcheck:
      test: ["CMD", "/app/pocket-id", "healthcheck"]
      interval: 5s
      timeout: 5s
      retries: 24
#@end
#@if pocket-id traefik network
    networks:
      - default
      - proxy
#@end
#@if pocket-id
    mem_limit: 256m
    restart: unless-stopped
#@end
#@if traefik pocket-id
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.${APP_NAME}-auth.rule=Host(`${AUTH_DOMAIN}`)"
      - "traefik.http.services.${APP_NAME}-auth.loadbalancer.server.port=1411"
#@end
#@if traefik pocket-id entrypoint
      - "traefik.http.routers.${APP_NAME}-auth.entrypoints=${TRAEFIK_ENTRYPOINT:?TRAEFIK_ENTRYPOINT must be set in .env}"
#@end
#@if traefik pocket-id resolver
      - "traefik.http.routers.${APP_NAME}-auth.tls.certresolver=${TRAEFIK_CERT_RESOLVER:?TRAEFIK_CERT_RESOLVER must be set in .env}"
#@end
#@if traefik pocket-id network
      - "traefik.docker.network=${TRAEFIK_NETWORK:?TRAEFIK_NETWORK must be set in .env}"
#@end
#@if pocket-id

  # Crée le client OIDC de Looty dans Pocket ID (pocket-id-init.sh, à côté de ce fichier), puis s'arrête.
  # Relancé à chaque « up » ; ne change rien si le client existe déjà. En cas d'échec :
  #   docker compose logs pocket-id-init
  pocket-id-init:
    image: curlimages/curl:8.23.0
    entrypoint: ["sh", "/pocket-id-init.sh"]
    environment:
      POCKET_ID_URL: http://pocket-id:1411
      POCKET_ID_STATIC_API_KEY: ${POCKET_ID_STATIC_API_KEY:-}
      OIDC_CLIENT_ID: ${OIDC_CLIENT_ID}
      OIDC_CLIENT_SECRET: ${OIDC_CLIENT_SECRET}
      OIDC_PROVIDER_ID: ${OIDC_PROVIDER_ID:?OIDC_PROVIDER_ID must be set in .env (uuidgen)}
      BASE_URL: ${BASE_URL}
      AUTH_DOMAIN: ${AUTH_DOMAIN}
    volumes:
      - ./pocket-id-init.sh:/pocket-id-init.sh:ro
    depends_on:
      pocket-id:
        condition: service_healthy
    restart: "no"
#@end
#@if turn

  # Relais TURN (coturn) pour les appels vocaux des personnes derrière un pare-feu ou un NAT restrictif ; l'audio
  # ne passe par lui qu'en dernier recours. Sur le réseau de l'hôte (pas de redirection de plages de ports) :
  # ouvrez 3478 (UDP et TCP) et 49160-49200 (UDP) sur le pare-feu. Si le serveur est derrière un NAT (cloud),
  # TURN_EXTERNAL_IP=adresse publique dans .env. Le secret partagé avec Looty est TURN_SECRET.
  coturn:
    image: coturn/coturn:4.6.3-alpine
    network_mode: host
    entrypoint: ["sh", "-c"]
    command:
      - |
        exec turnserver --no-cli --no-tls --no-dtls --fingerprint --use-auth-secret \
          --static-auth-secret="$$TURN_SECRET" --realm="$$TURN_REALM" --listening-port=3478 \
          --min-port=$$TURN_MIN_PORT --max-port=$$TURN_MAX_PORT --no-multicast-peers --log-file=stdout --simple-log \
          --denied-peer-ip=0.0.0.0-0.255.255.255 --denied-peer-ip=10.0.0.0-10.255.255.255 --denied-peer-ip=127.0.0.0-127.255.255.255 \
          --denied-peer-ip=169.254.0.0-169.254.255.255 --denied-peer-ip=172.16.0.0-172.31.255.255 --denied-peer-ip=192.168.0.0-192.168.255.255 \
          $${TURN_EXTERNAL_IP:+--external-ip=$$TURN_EXTERNAL_IP}
    environment:
      TURN_SECRET: ${TURN_SECRET:?TURN_SECRET must be set in .env}
      TURN_REALM: ${APP_DOMAIN:?APP_DOMAIN must be set in .env}
      TURN_MIN_PORT: ${TURN_MIN_PORT:-49160}
      TURN_MAX_PORT: ${TURN_MAX_PORT:-49200}
      TURN_EXTERNAL_IP: ${TURN_EXTERNAL_IP:-}
    mem_limit: 128m
    restart: unless-stopped
#@end
#@if backup

  # Sauvegarde automatique de la base : un export (pg_dump, compressé) au démarrage puis toutes les 24 heures, dans
  # ./data/db-backups ; les 7 derniers sont gardés. Les fichiers envoyés (./backend/uploads), .env et LOOTY_SECRET_KEY
  # sont à sauvegarder à part ; l'administration de Looty fait aussi des sauvegardes complètes (base et fichiers).
  # En cas d'échec : docker compose logs db-backup
  db-backup:
    image: postgres:18-alpine
    entrypoint: ["sh", "-c"]
    command:
      - |
        while true; do
          f=/backups/looty-$$(date +%Y%m%d-%H%M%S).sql.gz
          if PGPASSWORD="$$POSTGRES_PASSWORD" pg_dump -h postgres | gzip > "$$f.tmp"; then mv "$$f.tmp" "$$f"; else rm -f "$$f.tmp"; echo "pg_dump failed" >&2; fi
          ls -1t /backups/looty-*.sql.gz | tail -n +8 | xargs -r rm -f
          sleep 86400
        done
    environment:
      PGUSER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
      PGDATABASE: ${DB_NAME:-looty_db}
    volumes:
      - ./data/db-backups:/backups
    depends_on:
      postgres:
        condition: service_healthy
    mem_limit: 128m
    restart: unless-stopped
#@end
#@if traefik network

# Réseau Docker existant par lequel votre Traefik joint la pile (TRAEFIK_NETWORK dans .env).
networks:
  proxy:
    name: ${TRAEFIK_NETWORK:?TRAEFIK_NETWORK must be set in .env}
    external: true
#@end
