# Installation de Looty (https://github.com/untypequicode/looty). Les réglages de l'instance sont dans .env.
# Produit par deploy/render.sh à partir de deploy/templates/docker-compose.yml : modifier le modèle, pas ce fichier.
services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: ${DB_NAME:-looty_db}
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
    volumes:
      # Les données sont dans le dossier ./data/postgres (à côté de ce fichier) ; LOOTY_DB_DATA=/chemin/absolu les place ailleurs.
      # Depuis la 0.30 : plus de volume nommé. Si Looty tourne déjà avec le volume postgres_data_18, déplacez-le (README, « Move the database »).
      - ${LOOTY_DB_DATA:-./data/postgres}:/var/lib/postgresql
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${DB_USER:-postgres} -d ${DB_NAME:-looty_db}",
        ]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  backend:
    image: ghcr.io/untypequicode/looty-backend:${LOOTY_VERSION:-latest}
    environment:
      DATABASE_URL: postgres://${DB_USER:-postgres}:${DB_PASSWORD:-postgres}@postgres:5432/${DB_NAME:-looty_db}
      # Clé de chiffrement des mots de passe CalDAV (recommandé ; sinon générée dans uploads/.secret.key)
      LOOTY_SECRET_KEY: ${LOOTY_SECRET_KEY:-}
      # Autorise les serveurs CalDAV sur le réseau local / http (ex. Nextcloud interne)
      CALDAV_ALLOW_PRIVATE: ${CALDAV_ALLOW_PRIVATE:-false}
      # Autorise les serveurs Jupyter des notebooks sur le réseau local / http
      JUPYTER_ALLOW_PRIVATE: ${JUPYTER_ALLOW_PRIVATE:-false}
      # Démo publique : voir .env.example (jamais sur une vraie instance).
      LOOTY_DEMO: ${LOOTY_DEMO:-false}
      LOOTY_DEMO_MAX_COPIES: ${LOOTY_DEMO_MAX_COPIES:-30}
      LOOTY_DEMO_COPIES_PER_IP_HOUR: ${LOOTY_DEMO_COPIES_PER_IP_HOUR:-5}
      LOOTY_DEMO_MAX_FILE_MB: ${LOOTY_DEMO_MAX_FILE_MB:-2}
      LOOTY_DEMO_MAX_COPY_MB: ${LOOTY_DEMO_MAX_COPY_MB:-20}
      # E-mails : à configurer dans Administration > E-mail, ou ici (repli).
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-}
      SMTP_SECURITY: ${SMTP_SECURITY:-}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:-}
      SMTP_FROM_NAME: ${SMTP_FROM_NAME:-}
      PORT: 8080
      OIDC_ISSUER: ${OIDC_ISSUER}
      OIDC_CLIENT_ID: ${OIDC_CLIENT_ID}
      OIDC_CLIENT_SECRET: ${OIDC_CLIENT_SECRET}
      OIDC_PROVIDER_ID: ${OIDC_PROVIDER_ID:-}
      BASE_URL: ${BASE_URL:-http://localhost:3000}
    volumes:
      - ./backend/uploads:/app/uploads
      - ./backend/backups:/app/backups
    depends_on:
      postgres:
        condition: service_healthy
#@if traefik
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.${APP_NAME}-api.rule=Host(`${APP_DOMAIN}`) && (PathPrefix(`/api`) || PathPrefix(`/uploads`) || PathPrefix(`/pages`) || PathPrefix(`/dav`) || Path(`/.well-known/caldav`))"
      - "traefik.http.services.${APP_NAME}-api.loadbalancer.server.port=8080"
#@end
    restart: unless-stopped

  collaboration:
    image: ghcr.io/untypequicode/looty-collaboration:${LOOTY_VERSION:-latest}
    environment:
      DATABASE_URL: postgres://${DB_USER:-postgres}:${DB_PASSWORD:-postgres}@postgres:5432/${DB_NAME:-looty_db}
      BACKEND_URL: http://backend:8080
    depends_on:
      postgres:
        condition: service_healthy
#@if traefik
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.${APP_NAME}-collab.rule=Host(`${APP_DOMAIN}`) && PathPrefix(`/collab`)"
      - "traefik.http.middlewares.${APP_NAME}-collab-strip.stripprefix.prefixes=/collab"
      - "traefik.http.routers.${APP_NAME}-collab.middlewares=${APP_NAME}-collab-strip"
      - "traefik.http.services.${APP_NAME}-collab.loadbalancer.server.port=8082"
#@end
    restart: unless-stopped

  frontend:
    image: ghcr.io/untypequicode/looty-frontend:${LOOTY_VERSION:-latest}
#@if traefik
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.${APP_NAME}-web.rule=Host(`${APP_DOMAIN}`)"
      - "traefik.http.services.${APP_NAME}-web.loadbalancer.server.port=3000"
#@end
    restart: unless-stopped
#@if caddy

  # HTTPS automatique (Let's Encrypt) pour APP_DOMAIN ; le routage est dans le Caddyfile, à côté de ce fichier.
  # Les certificats sont gardés dans ./data/caddy. Les ports 80 et 443 de l'hôte doivent être libres.
  caddy:
    image: caddy:2-alpine
    environment:
      APP_DOMAIN: ${APP_DOMAIN:?APP_DOMAIN must be set in .env}
      # Domaine du fournisseur OIDC inclus (Pocket ID) ; vide sans lui.
      AUTH_DOMAIN: ${AUTH_DOMAIN:-}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./data/caddy:/data
      - ./data/caddy-config:/config
    depends_on:
      - backend
      - collaboration
      - frontend
    restart: unless-stopped
#@end
#@if caddy pocket-id
    networks:
      default:
        # Looty joint le fournisseur inclus par son adresse publique (https://AUTH_DOMAIN) : sur le réseau
        # Docker, ce nom mène directement à Caddy, sans dépendre d'un aller-retour par l'hôte.
        aliases:
          - ${AUTH_DOMAIN:?AUTH_DOMAIN must be set in .env}
#@end
#@if pocket-id

  # Fournisseur OIDC inclus : Pocket ID (connexion par passkey), servi sur https://AUTH_DOMAIN (un sous-domaine :
  # Pocket ID ne fonctionne pas sous un chemin). Ses données sont dans ./data/pocket-id.
  # Premier compte, juste après le premier démarrage : https://AUTH_DOMAIN/setup. Il devient admin de Pocket ID,
  # puis de Looty à sa première connexion (le premier compte de Looty en est l'administrateur).
  pocket-id:
    image: ghcr.io/pocket-id/pocket-id:v2.19.2
    environment:
      APP_URL: https://${AUTH_DOMAIN:?AUTH_DOMAIN must be set in .env}
      ENCRYPTION_KEY: ${POCKET_ID_ENCRYPTION_KEY:?POCKET_ID_ENCRYPTION_KEY must be set in .env}
      # Clé d'administration utilisée par pocket-id-init. Une fois le client créé, elle peut être retirée de .env.
      STATIC_API_KEY: ${POCKET_ID_STATIC_API_KEY:-}
      # Joignable seulement à travers le proxy, sur le réseau Docker.
      TRUST_PROXY: "true"
      ALLOW_INSECURE_CALLBACK_URLS: "false"
      ANALYTICS_DISABLED: "true"
    volumes:
      - ./data/pocket-id:/app/data
    healthcheck:
      test: ["CMD", "/app/pocket-id", "healthcheck"]
      interval: 5s
      timeout: 5s
      retries: 24
    restart: unless-stopped
#@end
#@if traefik pocket-id
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.${APP_NAME}-auth.rule=Host(`${AUTH_DOMAIN}`)"
      - "traefik.http.services.${APP_NAME}-auth.loadbalancer.server.port=1411"
#@end
#@if pocket-id

  # Crée le client OIDC de Looty dans Pocket ID (pocket-id-init.sh, à côté de ce fichier), puis s'arrête.
  # Relancé à chaque « up » ; ne change rien si le client existe déjà. En cas d'échec :
  #   docker compose logs pocket-id-init
  pocket-id-init:
    image: curlimages/curl:8.23.0
    entrypoint: ["sh", "/pocket-id-init.sh"]
    environment:
      POCKET_ID_URL: http://pocket-id:1411
      POCKET_ID_STATIC_API_KEY: ${POCKET_ID_STATIC_API_KEY:-}
      OIDC_CLIENT_ID: ${OIDC_CLIENT_ID}
      OIDC_CLIENT_SECRET: ${OIDC_CLIENT_SECRET}
      OIDC_PROVIDER_ID: ${OIDC_PROVIDER_ID:?OIDC_PROVIDER_ID must be set in .env (uuidgen)}
      BASE_URL: ${BASE_URL}
      AUTH_DOMAIN: ${AUTH_DOMAIN}
    volumes:
      - ./pocket-id-init.sh:/pocket-id-init.sh:ro
    depends_on:
      pocket-id:
        condition: service_healthy
    restart: "no"
#@end
