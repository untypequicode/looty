[package]
name = "looty-bridge"
version = "0.2.0"
edition = "2021"
description = "Agent that connects a PC to a Looty instance (PC tunnel, protocol v1)"
license = "GPL-3.0-or-later"
publish = false

[lib]
name = "looty_bridge"
path = "src/lib.rs"

[[bin]]
name = "looty-bridge"
path = "src/main.rs"

[[bin]]
name = "looty-latex-service"
path = "src/bin/latex_service.rs"

[dependencies]
axum = { version = "0.8", default-features = false, features = ["http1", "tokio"] }
zip = { version = "9", default-features = false, features = ["deflate"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "signal", "net", "io-util", "process", "fs"] }
tokio-tungstenite = { version = "0.29", default-features = false, features = ["connect", "handshake", "rustls-tls-webpki-roots"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
webpki-roots = "1"
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }
reqwest = { version = "0.13", default-features = false, features = ["stream"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
clap = { version = "4", features = ["derive", "env"] }
url = "2"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
panic = "abort"
