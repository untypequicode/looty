[package]
name = "backend"
version = "0.16.1"
edition = "2021"

[dependencies]
libc = "0.2"
axum = { version = "0.7", features = ["ws", "multipart"] }
tower-http = { version = "0.5.2", features = ["fs", "cors", "set-header"] }
futures = "0.3"
tokio = { version = "1.0", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sqlx = { version = "0.8", features = ["runtime-tokio-rustls", "postgres", "uuid", "chrono"] }
dotenvy = "0.15"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
openidconnect = "3.5.0"
tower-sessions = "0.13.0"
tower-sessions-sqlx-store = { version = "0.14.0", features = ["postgres"] }
reqwest = { version = "0.12", features = ["json"] }
time = "0.3.36"
uuid = { version = "1.8", features = ["serde", "v4"] }
chrono = { version = "0.4", features = ["serde"] }
flate2 = "1.0"
tar = "0.4"
tokio-util = { version = "0.7", features = ["io"] }
dashmap = "6.2.1"
ammonia = "4"
sha2 = "0.10"
hex = "0.4"
mime_guess = "2"
bytes = "1"
roxmltree = "0.20"
aes-gcm = "0.10"
base64 = "0.22"
rand = "0.8"
lettre = { version = "0.11", default-features = false, features = ["tokio1", "tokio1-native-tls", "smtp-transport", "builder", "hostname", "pool"] }
web-push-native = "0.4"
rrule = "0.13"
chrono-tz = "0.9"
async-imap = { version = "0.10", default-features = false, features = ["runtime-tokio"] }
async-native-tls = { version = "0.5", default-features = false, features = ["runtime-tokio"] }
mail-parser = "0.9"
zip = { version = "2", default-features = false, features = ["deflate"] }
